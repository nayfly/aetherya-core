# Local phase-1 stack: the decision service plus the Redis it needs for shared
# state. See docs/rollout-phases.md.
#
#   docker compose up --build
#   curl -s localhost:8080/health | python -m json.tool
#   open http://localhost:8080
#
# This runs the decision profile only. The approvals service is deliberately
# absent: it signs approval proofs, is localhost-only by design, and belongs on
# a separate trust boundary — phase 3, not phase 1.

services:
  redis:
    image: redis:7-alpine
    container_name: aetherya-redis
    ports:
      # Loopback only. This holds the confirmation replay store, so network
      # access to it means deleting replay records and reusing approval proofs
      # — the single-use guarantee lives in here, not just in the signature.
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  aetherya:
    build: .
    container_name: aetherya-decision
    ports:
      # Bound to the loopback interface on the host, not 0.0.0.0. In a container
      # the app-level "must come from 127.0.0.1" check can never pass — every
      # client arrives as the bridge gateway — so the port publication is what
      # actually keeps the admin routes off the network.
      - "127.0.0.1:8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    # Secrets come from the file, never from `${VAR}` interpolation. Compose
    # gives the invoking shell precedence over .env, so an exported variable
    # silently wins over the file — which is how a rotated console key kept
    # reverting to an older value and locked the console out with no
    # indication that two different keys were in play.
    env_file:
      - .env
    environment:
      # Shared rate-limit state. With the in-process backend, N replicas mean
      # N x the configured limit — see docs/security-model.md.
      AETHERYA_RATE_LIMIT_REDIS_URL: redis://redis:6379/0
      AETHERYA_CONFIRMATION_REPLAY_REDIS_URL: redis://redis:6379/1

      # Pin the policy so a replica refuses to start under an unintended one.
      # Get the value with: aetherya policy fingerprint --json
      # Left unset locally so the stack comes up before you have run that.
      # AETHERYA_EXPECTED_POLICY_FINGERPRINT: "sha256:..."

    volumes:
      # The audit chain must survive the container. Without this, every restart
      # begins a new chain and the old one is gone.
      - audit-data:/app/audit
      # Edit config/policy.yaml on the host and restart to apply.
      - ./config:/app/config:ro
    command:
      - aetherya-api
      - --host=0.0.0.0
      - --port=8080
      # Deployment policy: same as config/policy.yaml with the
      # distributed rate-limit backend.
      - --policy-path=config/policy.docker.yaml
      - --audit-path=audit/decisions.jsonl
      - --require-semantic-ready
      # Safe only because the port above is published on loopback.
      - --approval-trust-network-boundary

    restart: unless-stopped

  # OpenAI-compatible boundary in front of a real provider. Point OpenClaw (or
  # anything that takes a custom provider) at http://localhost:8090/v1 and every
  # tool call the model proposes is ruled on before the agent sees it.
  #
  # Shares audit-data with the decision service on purpose: both write the same
  # trail, so the console shows agent traffic alongside CLI decisions. That is
  # only safe because the audit writer takes an exclusive lock and re-reads the
  # chain tip under it — before that, two writers corrupted the chain in silence.
  #
  # Requires ANTHROPIC_API_KEY (or OPENAI_API_KEY) in .env. Without one the
  # container starts and answers /health, and every completion returns 502.
  gateway:
    build: .
    container_name: aetherya-gateway
    ports:
      # Loopback only: this process holds your upstream API key and
      # authenticates nobody.
      - "127.0.0.1:8090:8090"
    depends_on:
      aetherya:
        condition: service_healthy
    # Same reasoning as above. The provider key lives in its own file so the
    # decision service never receives a credential it has no use for.
    env_file:
      - .env
      - .env.provider
    volumes:
      - audit-data:/app/audit
      - ./config:/app/config:ro
    command:
      - aetherya-gateway
      - --host=0.0.0.0
      - --port=8090
      - --provider=${AETHERYA_GATEWAY_PROVIDER:-anthropic}
      - --model=${AETHERYA_GATEWAY_MODEL:-claude-opus-5}
      # `openclaw` must exist in capability_matrix.actors or phase 3 refuses
      # every call — the gateway will not start at phase 3 without it.
      - --actor=${AETHERYA_GATEWAY_ACTOR:-robert}
      - --policy-path=config/policy.docker.yaml
      - --audit-path=audit/decisions.jsonl
    # The image's healthcheck probes 8080 and asserts fields only the decision
    # service reports, so the gateway inherits a check it can never pass.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json, urllib.request
          d = json.load(urllib.request.urlopen("http://127.0.0.1:8090/health", timeout=4))
          raise SystemExit(0 if d.get("ok") and d.get("upstream_key_present") else 1)
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

volumes:
  redis-data:
  audit-data:
